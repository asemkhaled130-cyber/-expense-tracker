name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: unzip -q ./*.zip -d project
      - name: Build
        working-directory: project/expense-tracker-app
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: project/expense-tracker-app/app/build/outputs/apk/debug/*.apk
